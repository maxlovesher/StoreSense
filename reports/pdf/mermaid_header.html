<!-- Put into the HTML <head> by reports/build_pdf.py. Draws every ```mermaid block as a diagram
     before the browser prints the page. data-external="1" stops pandoc from inlining the script. -->
<script data-external="1" src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  // pandoc writes a mermaid block as <pre class="mermaid"><code>...</code></pre>; mermaid wants a div with the text.
  document.querySelectorAll('pre.mermaid').forEach(pre => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = pre.textContent;
    pre.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose', flowchart: { useMaxWidth: true, htmlLabels: true } });
  try {
    await mermaid.run({ querySelector: 'div.mermaid' });
  } catch (e) {
    // Shown at the top of page 1, so a broken diagram cannot go unnoticed; build_pdf.py looks for this text.
    const msg = (e && (e.message || e.str)) || String(e);
    document.body.insertAdjacentHTML('afterbegin', '<p style="color:red">Mermaid error: ' + msg + '</p>');
  }
});
</script>
